<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNG ONE</title>
<link rel="stylesheet" href="/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="gate">
  <div class="spinner"></div>
  <p id="gate-text">Opening your account...</p>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span> SNG ONE</div>
    <div class="actions">
      <button class="iconbtn" id="row-theme" aria-label="Theme" data-icon="sun" data-icon-size="17"></button>
      <select id="lang-select" class="iconbtn" style="width:auto;">
        <option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option>
      </select>
    </div>
  </header>

  <!-- ===== Dashboard ===== -->
  <main id="view-dashboard" class="view active">
    <h1 class="page-title" data-t="dash_title"></h1>
    <p class="page-sub" data-t="dash_sub"></p>

    <div class="tiles">
      <button class="tile" data-action="tile-cargo">
        <span class="tile-icon" style="background:var(--brand-light);color:var(--brand);" data-icon="package" data-icon-size="18"></span>
        <div><div class="tile-title" data-t="tile_find_cargo"></div><div class="tile-sub" data-t="tile_find_cargo_sub"></div></div>
      </button>
      <button class="tile" data-action="tile-truck">
        <span class="tile-icon" style="background:var(--success-bg);color:var(--success);" data-icon="truck" data-icon-size="18"></span>
        <div><div class="tile-title" data-t="tile_find_truck"></div><div class="tile-sub" data-t="tile_find_truck_sub"></div></div>
      </button>
      <button class="tile" data-action="tile-post">
        <span class="tile-icon" style="background:#fef6e7;color:#b54708;" data-icon="plus" data-icon-size="18"></span>
        <div><div class="tile-title" data-t="tile_publish"></div><div class="tile-sub" data-t="tile_publish_sub"></div></div>
      </button>
      <a class="tile" id="tile-group" href="https://t.me/sngOne_yuklar" target="_blank" rel="noopener">
        <span class="tile-icon" style="background:rgba(38,164,227,0.12);color:var(--telegram);" data-icon="send" data-icon-size="18"></span>
        <div><div class="tile-title" data-t="tile_group"></div><div class="tile-sub" data-t="tile_group_sub"></div></div>
      </a>
    </div>

    <div class="chips" id="dash-chips">
      <div class="chip on" data-kind="loads"><span data-t="chip_cargo"></span><span class="n" id="chip-cargo-n">–</span></div>
      <div class="chip" data-kind="trucks"><span data-t="chip_truck"></span><span class="n" id="chip-truck-n">–</span></div>
    </div>

    <div class="quickbar">
      <input id="dash-from" data-t-ph="ph_from">
      <input id="dash-to" data-t-ph="ph_to">
      <button class="iconbtn" id="dash-filter-btn" aria-label="Search" data-icon="search" data-icon-size="16"></button>
    </div>

    <div class="section-head">
      <h3 data-t="new_listings"></h3>
      <button class="link" id="dash-refresh"><span data-icon="refresh-cw" data-icon-size="13"></span><span data-t="btn_refresh"></span></button>
    </div>
    <div class="feed" id="dash-feed"></div>
  </main>

  <!-- ===== Search ===== -->
  <main id="view-search" class="view">
    <h1 class="page-title" data-t="search_title"></h1>
    <p class="page-sub" data-t="search_sub"></p>

    <div class="toggle2">
      <button class="seg on" id="search-seg-loads" data-t="chip_cargo"></button>
      <button class="seg" id="search-seg-trucks" data-t="chip_truck"></button>
    </div>

    <div class="field row2">
      <div><label data-t="ph_from"></label><select id="search-from-country"></select></div>
      <div><label data-t="ph_to"></label><select id="search-to-country"></select></div>
    </div>
    <div class="field row2">
      <input id="search-from-city" data-t-ph="ph_city">
      <input id="search-to-city" data-t-ph="ph_city">
    </div>
    <div class="field">
      <label data-t="transport_type"></label>
      <select id="search-equip">
        <option value="" data-t="opt_any"></option>
        <option value="T">T - Tent</option><option value="R">R - Reefer</option>
        <option value="F">F - Flatbed</option><option value="V">V - Van</option><option value="AC">AC - Car carrier</option>
      </select>
    </div>
    <button class="btn btn-primary" id="search-go"><span data-icon="search" data-icon-size="15"></span><span id="search-go-text"></span></button>
    <div class="btn-row">
      <button class="btn btn-ghost" id="search-nearby" data-t="btn_nearby"></button>
      <button class="btn btn-ghost" id="search-clear" data-t="btn_clear"></button>
    </div>
    <select class="hidden" id="search-radius" style="margin-top:8px;">
      <option value="50">50 km</option><option value="100" selected>100 km</option><option value="150">150 km</option>
    </select>

    <div class="result-head"><span id="search-count"></span></div>
    <div class="feed" id="search-results"></div>
  </main>

  <!-- ===== Near Me ===== -->
  <main id="view-nearby" class="view">
    <h1 class="page-title" data-t="nearby_title"></h1>
    <p class="page-sub" data-t="nearby_sub"></p>

    <div class="toggle2">
      <button class="seg on" id="nearby-seg-loads" data-t="chip_cargo"></button>
      <button class="seg" id="nearby-seg-trucks" data-t="chip_truck"></button>
    </div>

    <button class="btn btn-primary" id="nearby-locate"><span data-icon="map-pin" data-icon-size="15"></span><span id="nearby-locate-text"></span></button>
    <div class="radius-row">
      <select class="hidden" id="nearby-radius">
        <option value="50">50 km</option><option value="100" selected>100 km</option><option value="150">150 km</option>
      </select>
    </div>

    <div class="result-head"><span id="nearby-count"></span></div>
    <div class="feed" id="nearby-results"></div>
  </main>

  <!-- ===== Profile ===== -->
  <main id="view-profile" class="view">
    <h1 class="page-title" data-t="profile_title"></h1>
    <div class="profile-head">
      <div class="avatar" id="profile-avatar">–</div>
      <div class="profile-name" id="profile-name">–</div>
      <div class="profile-id" id="profile-id"></div>
    </div>

    <div class="rowlist">
      <div class="rrow" id="row-contacts">
        <span class="ricon" data-icon="circle-user" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_contacts"></div><div class="rsub" id="row-contacts-sub"></div></div>
      </div>
      <div class="rrow" id="row-language">
        <span class="ricon" data-icon="map-pin" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_language"></div><div class="rsub" id="row-language-sub"></div></div>
      </div>
      <button class="rrow" id="row-theme-row">
        <span class="ricon" data-icon="moon" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_theme"></div><div class="rsub" data-t="row_theme_sub"></div></div>
      </button>
      <div class="rrow" id="row-listings">
        <span class="ricon" data-icon="file-box" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_listings"></div><div class="rsub" id="row-listings-sub" data-t="row_listings_empty"></div></div>
      </div>
      <a class="rrow" id="row-support" href="https://t.me/sngOne_yuklarr" target="_blank" rel="noopener">
        <span class="ricon" data-icon="message-circle" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_support"></div><div class="rsub" data-t="row_support_sub"></div></div>
        <span class="rchev" data-icon="chevron-right" data-icon-size="16"></span>
      </a>
    </div>

    <div class="group-gap"></div>
    <div class="rowlist">
      <a class="rrow" id="row-other-bot" href="https://t.me/sng_loadboard_bot" target="_blank" rel="noopener">
        <span class="ricon" data-icon="send" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_other_bot"></div></div>
        <span class="rchev" data-icon="chevron-right" data-icon-size="16"></span>
      </a>
      <a class="rrow" id="row-platform" href="https://sng-pro.com" target="_blank" rel="noopener">
        <span class="ricon" data-icon="house" data-icon-size="17"></span>
        <div class="rtext"><div class="rtitle" data-t="row_platform"></div></div>
        <span class="rchev" data-icon="chevron-right" data-icon-size="16"></span>
      </a>
    </div>

    <div class="group-gap"></div>
    <button class="btn btn-ghost" id="btn-logout" data-t="btn_logout"></button>
  </main>

  <!-- ===== Bottom tab bar ===== -->
  <nav class="tabbar">
    <button class="tab on" data-view="dashboard"><span data-icon="house" data-icon-size="20"></span><span data-t="nav_dashboard"></span></button>
    <button class="tab" data-view="search"><span data-icon="search" data-icon-size="20"></span><span data-t="nav_search"></span></button>
    <button class="tab raised" id="tab-post">
      <span class="tab-raise" data-icon="plus" data-icon-size="22"></span>
      <span data-t="nav_post"></span>
    </button>
    <button class="tab" data-view="nearby"><span data-icon="map-pinned" data-icon-size="20"></span><span data-t="nav_nearby"></span></button>
    <button class="tab" data-view="profile"><span data-icon="circle-user" data-icon-size="20"></span><span data-t="nav_profile"></span></button>
  </nav>
</div>

<!-- ===== Post sheet ===== -->
<div id="postmodal-backdrop"></div>
<div id="postmodal">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3 data-t="new_listing"></h3>
    <button class="iconbtn" id="postmodal-close" data-icon="x" data-icon-size="16"></button>
  </div>
  <div class="toggle3">
    <button class="seg on" data-post-tab="text" data-t="tab_as_text"></button>
    <button class="seg" data-post-tab="cargo" data-t="tab_cargo"></button>
    <button class="seg" data-post-tab="truck" data-t="tab_truck"></button>
  </div>

  <div id="post-text">
    <p class="ai-hint"><span data-icon="sparkles" data-icon-size="15"></span><span data-t="paste_hint"></span></p>
    <textarea id="post-text-input" rows="4" data-t-ph="paste_placeholder"></textarea>
    <button class="btn btn-primary" id="post-text-send" style="margin-top:10px;" data-t="btn_send_processing"></button>
    <div id="post-text-review"></div>
  </div>

  <form id="post-cargo" class="hidden">
    <div class="field row2">
      <div><label data-t="ph_from"></label><select id="pc-from-country"></select><input id="pc-from-city" data-t-ph="ph_city" style="margin-top:6px;"></div>
      <div><label data-t="ph_to"></label><select id="pc-to-country"></select><input id="pc-to-city" data-t-ph="ph_city" style="margin-top:6px;"></div>
    </div>
    <div class="field">
      <label data-t="lbl_required_transport"></label>
      <select id="pc-equip"><option value="T">T - Tent</option><option value="R">R - Reefer</option><option value="F">F - Flatbed</option><option value="V">V - Van</option><option value="AC">AC - Car carrier</option></select>
    </div>
    <div class="field row2">
      <div><label data-t="lbl_weight"></label><input id="pc-weight" type="number" step="0.1" min="0.1" max="100"></div>
      <div><label data-t="lbl_volume"></label><input id="pc-volume" type="number" step="1" min="1" max="200"></div>
    </div>
    <label data-t="lbl_date"></label>
    <div class="btn-row"><button type="button" class="btn btn-ghost" data-pc-date="today" data-t="date_today"></button><button type="button" class="btn btn-ghost" data-pc-date="tomorrow" data-t="date_tomorrow"></button></div>
    <div class="datechips" id="pc-date-chips"></div>
    <div class="field">
      <label data-t="lbl_price"></label>
      <input id="pc-price" type="number" step="1" min="0" data-t-ph="ph_negotiable">
    </div>
    <div class="field">
      <label data-t="lbl_additional"></label>
      <textarea id="pc-notes" rows="2" data-t-ph="ph_comment"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" data-t="btn_publish"></button>
  </form>

  <form id="post-truck" class="hidden">
    <div class="field row2">
      <div><label data-t="ph_from"></label><select id="pt-from-country"></select><input id="pt-from-city" data-t-ph="ph_city" style="margin-top:6px;"></div>
      <div><label data-t="ph_to"></label><input id="pt-dest-pref" placeholder="Anywhere"></div>
    </div>
    <div class="field">
      <label data-t="lbl_transport"></label>
      <select id="pt-equip"><option value="T">T - Tent</option><option value="R">R - Reefer</option><option value="F">F - Flatbed</option><option value="V">V - Van</option><option value="AC">AC - Car carrier</option></select>
    </div>
    <div class="field row2">
      <div><label data-t="lbl_capacity"></label><input id="pt-capacity" type="number" step="0.1" min="0.1" max="100"></div>
      <div><label data-t="lbl_volume"></label><input id="pt-volume" type="number" step="1" min="1" max="200"></div>
    </div>
    <label data-t="lbl_date"></label>
    <div class="btn-row"><button type="button" class="btn btn-ghost" data-pt-date="today" data-t="date_today"></button><button type="button" class="btn btn-ghost" data-pt-date="tomorrow" data-t="date_tomorrow"></button></div>
    <div class="datechips" id="pt-date-chips"></div>
    <div class="field">
      <label data-t="lbl_additional"></label>
      <textarea id="pt-notes" rows="2" data-t-ph="ph_comment"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" data-t="btn_publish"></button>
  </form>
</div>

<script src="/icons.js"></script>
<script src="/config.js"></script>
<script src="/util.js"></script>
<script src="/i18n.js"></script>
<script src="/session-shim.js"></script>
<script src="/api.js"></script>
<script src="/telegram-miniapp.js"></script>
<script src="/app.js"></script>
</body>
</html>
